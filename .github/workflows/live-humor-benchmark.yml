name: live-humor-benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - eval/one-off-default-model

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install COOKED dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama and pull model
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if ollama list >/dev/null 2>&1; then break; fi
            sleep 2
          done
          ollama pull qwen2.5:3b
      - name: Run live benchmark
        env:
          COOKED_PROVIDER: ollama
          COOKED_MODEL: qwen2.5:3b
          REQUEST_TIMEOUT: "180"
        run: |
          PYTHONPATH=. python scripts/humor_benchmark.py --output-dir benchmark-results
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cooked-live-humor-benchmark
          path: benchmark-results/
          if-no-files-found: warn
