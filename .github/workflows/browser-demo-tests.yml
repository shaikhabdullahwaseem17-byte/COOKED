name: Browser demo tests
on:
  push:
    paths:
      - "cloudflare-demo/**"
      - ".github/workflows/browser-demo-tests.yml"
  pull_request:
    paths:
      - "cloudflare-demo/**"
      - ".github/workflows/browser-demo-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run browser demo unit tests
        working-directory: cloudflare-demo
        run: node --test
