name: Idea or improvement
description: Suggest a style, example, workflow or interface improvement.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you change, and why?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example (optional)
      description: A fictional example helps us understand the suggestion.
    validations:
      required: false
